<html>
    <head>
        <title>
       wecome to javascript
        </title>
    </head>
    <body>
        <h2>basic function of html</h2>
        <script>
            let oddeven=function(number){
                if(number % 2==0){
                    document.write(number + "is an even number");
                }
                else{
                    document.write(number + "is an odd number");
                }
            }
            let number=prompt("enter the number");
            oddeven(number);
        </script>
    </body>
</html>
